<!DOCTYPE html>
<!-- Coding by royal 420 KE | youtube.com/royal420ke -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Roll dice project | Royal 420 KE</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: sans-serif;
        border: 0;
        outline: 0;
      }
      .dice {
        position: relative;
        width: 60px;
        height: 60px;
        transform-style: preserve-3d;
        transition: 1s ease;
      }
      @keyframes rolling {
        50% {
          transform: rotateX(455deg) rotateY(455deg);
        }
      }
      .face {
        position: absolute;
        width: 100%;
        height: 100%;
        border: 5px solid #f6f3f0;
        border-radius: 20px;
        background: linear-gradient(145deg, #dddbd8, #fff);
        transform-style: preserve-3d;
      }
      .face::before {
        content: "";
        position: absolute;
        width: 100%;
        height: 100%;
        border-radius: 20px;
        background: #f6f3f0;
        transform: translateZ(-1px);
      }
      .face::after {
        content: "";
        position: absolute;
        left: 50%;
        top: 50%;
        width: 10px; /* Reduced size of the dot */
        height: 10px; /* Reduced size of the dot */
        background: #000;
        border-radius: 50%;
        margin: -5px 0 0 -5px; /* Adjusted margin to center the smaller dot */
      }
      .front {
        transform: translateZ(50px);
      }
      .back {
        transform: rotateX(180deg) translateZ(50px);
      }
      .top {
        transform: rotateX(90deg) translateZ(50px);
      }
      .bottom {
        transform: rotateX(-90deg) translateZ(50px);
      }
      .right {
        transform: rotateY(90deg) translateZ(50px);
      }
      .left {
        transform: rotateY(-90deg) translateZ(50px);
      }
      .front::after {
        width: 15px; /* Reduced dot size for the front face */
        height: 15px;
        margin: -7px 0 0 -7px; /* Adjusted margin for smaller dot */
      }
      .back::after {
        margin: -25px 0 0 -25px;
        box-shadow: 30px 0, 0 20px, 30px 20px, 0 40px, 30px 40px; /* Adjusted for smaller dot placement */
      }

      .top::after {
        margin: -22px 0 0 -22px;
        box-shadow: 30px 30px; /* Adjusted for smaller dot placement */
      }

      .bottom::after {
        margin: -28px 0 0 -28px;
        box-shadow: 20px 20px, 40px 40px, 40px 0, 0 40px; /* Adjusted for smaller dot placement */
      }

      .right::after {
        margin: -22px 0 0 -22px;
        box-shadow: 30px 0, 0 30px, 30px 30px; /* Adjusted for smaller dot placement */
      }

      .left::after {
        margin: -25px 0 0 -25px;
        box-shadow: 20px 20px, 40px 40px; /* Adjusted for smaller dot placement */
      }

      .roll {
        background-color: white;
        margin-top: 60px;
        padding: 6px 12px;
        border-radius: 3px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <!-- <div class="dice">
        <div class="face front"></div>
        <div class="face back"></div>
        <div class="face top"></div>
        <div class="face bottom"></div>
        <div class="face right"></div>
        <div class="face left"></div>
      </div> -->
      <button class="roll">
        <div class="dice">
          <div class="face front"></div>
          <div class="face back"></div>
          <div class="face top"></div>
          <div class="face bottom"></div>
          <div class="face right"></div>
          <div class="face left"></div>
        </div>
      </button>
    </div>
    <script>
      const dice = document.querySelector(".dice");
const rollBtn = document.querySelector(".roll");

const randomDice = () => {
  const random = Math.floor(Math.random() * 6) + 1;  // Generate a random number between 1 and 6
  rollDice(random);  // Call the rollDice function with the random number
  console.log(random);
};

const rollDice = (random) => {
  dice.style.animation = "rolling 4s";  // Trigger the rolling animation

  setTimeout(() => {
    // Rotate the dice based on the random number generated
    switch (random) {
      case 1:
        dice.style.transform = "rotateX(0deg) rotateY(0deg)";
        break;
      case 2:
        dice.style.transform = "rotateX(-90deg) rotateY(0deg)";
        break;
      case 3:
        dice.style.transform = "rotateX(0deg) rotateY(90deg)";
        break;
      case 4:
        dice.style.transform = "rotateX(0deg) rotateY(-90deg)";
        break;
      case 5:
        dice.style.transform = "rotateX(90deg) rotateY(0deg)";
        break;
      case 6:
        dice.style.transform = "rotateX(180deg) rotateY(0deg)";
        break;
      default:
        break;
    }

    dice.style.animation = "none"; // Stop the animation after it completes
    setTimeout(() => {
      dice.style.animation = ""; // Reset the animation so it can be triggered again
    }, 50);

    window.ReactNativeWebView?.postMessage(random);  // Send the result (optional, based on your needs)
  }, 4000);  // Wait for the animation to complete before stopping it
};

rollBtn.addEventListener("click", randomDice);
    </script>
  </body>
</html>
